apiVersion: apps/v1
kind: Deployment
metadata:
  name: uni-library-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uni-library
  template:
    metadata:
      labels:
        app: uni-library
    spec:
      containers:
      - name: web
        image: university-library-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: uni-library-service
spec:
  type: NodePort
  selector:
    app: uni-library
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30007